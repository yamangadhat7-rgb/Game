<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>
<title>هجولة سيتي 3D — Life Edition</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:#05070c;font-family:'Segoe UI',Tahoma,sans-serif;color:#e8f0ff;user-select:none}
canvas{display:block;position:fixed;inset:0}
.hidden{display:none!important}

#menu{position:fixed;inset:0;overflow-y:auto;z-index:20;padding:14px;
  background:radial-gradient(circle at 50% 0%,rgba(30,20,60,.86),rgba(5,7,12,.96) 60%);
  backdrop-filter:blur(8px)}
.menuInner{max-width:620px;margin:0 auto;padding-bottom:60px}
#menu h1{font-size:28px;text-align:center;margin:6px 0 2px;font-weight:900;letter-spacing:1px;
  background:linear-gradient(90deg,#00e5ff,#ff2d95,#ffd700);-webkit-background-clip:text;background-clip:text;color:transparent}
#menu .sub{text-align:center;color:#7d90b0;font-size:12px;margin-bottom:8px}
#preview{width:100%;height:170px;display:block;border-radius:16px;
  background:radial-gradient(circle at 50% 70%,rgba(0,229,255,.10),transparent 60%);margin-bottom:6px}
#menu h3{font-size:14px;color:#8fa6c8;margin:14px 0 7px;border-right:3px solid #00e5ff;padding-right:8px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
input{flex:1;min-width:110px;padding:11px;border-radius:10px;border:1px solid #22304a;background:#0d1524;color:#e8f0ff;font-size:14px;outline:none;font-family:inherit}
input:focus{border-color:#00e5ff}
button{font-family:inherit;cursor:pointer;border:none;border-radius:10px;font-weight:700;transition:.15s}
button:active{transform:scale(.97)}
.primary{padding:13px 20px;background:linear-gradient(135deg,#00c8ff,#0066ff);color:#fff;font-size:15px;flex:1;box-shadow:0 6px 22px rgba(0,140,255,.35)}
.primary:hover{filter:brightness(1.15)}
.ghost{padding:12px 18px;background:#16203a;color:#cfe0ff;font-size:14px;flex:1;border:1px solid #22304a}
.ghost:hover{background:#1e2c4d}

#cars,#maps{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:7px}
.card{background:#0e1626;border:2px solid #1b2740;border-radius:12px;padding:9px;text-align:right;color:#cfe0ff;display:flex;flex-direction:column;gap:3px}
.card b{font-size:12.5px;color:#fff}
.card span{font-size:10.5px;color:#6e83a6}
.card.sel{border-color:#00e5ff;background:#0f2233;box-shadow:0 0 16px rgba(0,229,255,.35)}
.card .dot{width:100%;height:6px;border-radius:3px;margin-bottom:3px}

#skins{display:grid;grid-template-columns:repeat(auto-fill,minmax(56px,1fr));gap:6px;max-height:130px;overflow-y:auto;padding:3px}
.skin{height:44px;border-radius:10px;border:2px solid #1b2740;position:relative;overflow:hidden}
.skin.sel{border-color:#ffd700;box-shadow:0 0 14px rgba(255,215,0,.5)}
.skin i{position:absolute;bottom:1px;right:3px;font-size:8.5px;font-style:normal;color:#fff;text-shadow:0 1px 3px #000}

.modeRow{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.modeBtn{padding:14px;background:#0e1626;border:2px solid #1b2740;border-radius:12px;color:#cfe0ff;font-size:14px}
.modeBtn.sel{border-color:#ffd700;background:#1a1520;color:#ffd700;box-shadow:0 0 18px rgba(255,215,0,.25)}

#status{min-height:20px;margin-top:10px;font-size:12.5px;color:#00e5ff;text-align:center}
#status.err{color:#ff5577}

#hud{position:fixed;inset:0;pointer-events:none;z-index:10}
#speedo{position:absolute;bottom:20px;left:20px;background:rgba(8,14,26,.55);border:1px solid rgba(0,229,255,.25);
  border-radius:16px;padding:6px 20px;text-align:center;backdrop-filter:blur(8px)}
#speedo span{font-size:34px;font-weight:900;color:#00e5ff;line-height:1;text-shadow:0 0 18px rgba(0,229,255,.6)}
#speedo small{display:block;font-size:10px;color:#6e83a6;letter-spacing:1px}

#cashBox{position:absolute;top:18px;left:18px;background:rgba(8,14,26,.65);border:1px solid rgba(0,255,150,.35);
  border-radius:14px;padding:8px 16px;color:#00ff96;font-size:14px;text-align:center;display:flex;gap:10px;align-items:center;backdrop-filter:blur(8px)}
#cashBox b{color:#fff;font-size:18px}

#healthBox{position:absolute;top:18px;right:18px;background:rgba(8,14,26,.65);border:1px solid rgba(255,80,80,.35);
  border-radius:14px;padding:6px 16px;min-width:140px;backdrop-filter:blur(8px)}
#healthBar{height:10px;background:rgba(60,10,10,.6);border-radius:6px;overflow:hidden;margin-top:4px}
#healthFill{height:100%;background:linear-gradient(90deg,#ff2222,#ff5555);transition:width .15s;width:100%}
#healthBox small{font-size:11px;color:#8fa6c8;display:block}

#stateBadge{position:absolute;bottom:20px;left:50%;transform:translateX(-50%);
  background:rgba(8,14,26,.65);border:1px solid rgba(0,229,255,.3);border-radius:12px;
  padding:5px 14px;font-size:12px;color:#9fb6d6;display:flex;gap:8px;align-items:center;backdrop-filter:blur(8px)}
#stateBadge b{color:#00e5ff}
#stateBadge.walking b{color:#ffd700}

#crosshair{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
  width:26px;height:26px;display:none;pointer-events:none}
#crosshair::before,#crosshair::after{content:'';position:absolute;background:#ff2d95;box-shadow:0 0 8px #ff2d95}
#crosshair::before{left:50%;top:0;width:2px;height:100%;transform:translateX(-50%)}
#crosshair::after{top:50%;left:0;height:2px;width:100%;transform:translateY(-50%)}

#hint{position:absolute;bottom:80px;left:50%;transform:translateX(-50%);
  background:rgba(8,14,26,.75);border:1px solid rgba(255,215,0,.4);border-radius:10px;
  padding:6px 16px;font-size:12.5px;color:#ffd700;display:none;backdrop-filter:blur(6px)}

#minimap{position:absolute;bottom:20px;right:20px;width:130px;height:130px;border-radius:14px;
  border:1px solid rgba(0,229,255,.25);box-shadow:0 0 24px rgba(0,0,0,.6)}
#roomInfo{position:absolute;top:18px;left:50%;transform:translateX(-50%);background:rgba(8,14,26,.6);border:1px solid rgba(0,229,255,.25);
  border-radius:14px;padding:6px 16px;font-size:12px;color:#9fb6d6;text-align:center;backdrop-filter:blur(8px);display:none}
#roomInfo b{color:#00e5ff;font-size:15px;letter-spacing:3px}
#btnExit{position:absolute;top:80px;right:18px;pointer-events:auto;padding:7px 16px;
  background:rgba(60,12,26,.8);color:#ff7799;border:1px solid #4a1f33;font-size:12px}

#countdown{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;z-index:18;
  pointer-events:none;font-size:120px;font-weight:900;color:#fff;
  text-shadow:0 0 40px rgba(0,229,255,.9),0 0 80px rgba(255,45,149,.6);display:none}

/* قوائم داخل اللعبة */
#gameMenu{position:fixed;inset:0;z-index:19;background:rgba(5,7,12,.9);backdrop-filter:blur(10px);
  display:none;padding:20px;overflow-y:auto}
#gameMenu .menuWrap{max-width:600px;margin:0 auto}
#gameMenu h2{font-size:24px;margin-bottom:14px;text-align:center;
  background:linear-gradient(90deg,#00e5ff,#ffd700);-webkit-background-clip:text;background-clip:text;color:transparent}
#gameMenu .section{background:#0e1626;border:1px solid #1b2740;border-radius:14px;padding:14px;margin-bottom:12px}
#gameMenu .section h3{font-size:15px;color:#8fa6c8;margin-bottom:10px}
#gameMenu button{width:100%;padding:12px;margin-bottom:6px;background:#16203a;color:#cfe0ff;font-size:14px;text-align:right;border-radius:10px}
#gameMenu button:hover{background:#1e2c4d}
#gameMenu button.buy{background:linear-gradient(135deg,#00a050,#006630);color:#fff}
#gameMenu button.buy:disabled{background:#2a2a2a;color:#666;cursor:not-allowed}
#gameMenu button.close{background:rgba(255,50,50,.2);color:#ff8888;border:1px solid #4a1f33}
#gameMenu .cash{color:#00ff96;font-weight:900}
#gameMenu .itemRow{display:flex;justify-content:space-between;align-items:center;padding:10px;background:#0a1220;border-radius:10px;margin-bottom:6px}
#gameMenu .itemRow b{color:#fff;font-size:13px}
#gameMenu .itemRow small{color:#6e83a6;font-size:11px;display:block}

#finishMsg{position:fixed;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;
  z-index:19;background:rgba(5,7,12,.9);backdrop-filter:blur(8px);pointer-events:auto;padding:24px;text-align:center}
#finishMsg h2{font-size:32px;margin-bottom:14px;background:linear-gradient(90deg,#00e5ff,#ffd700);
  -webkit-background-clip:text;background-clip:text;color:transparent}
#finishMsg p{color:#9fb6d6;font-size:15px;margin-bottom:18px}
#finishMsg button{padding:14px 40px;font-size:15px;background:linear-gradient(135deg,#00c8ff,#0066ff);color:#fff;border-radius:12px}

#touch{position:fixed;inset:0;z-index:15;pointer-events:none}
#touch button{position:absolute;pointer-events:auto;width:70px;height:70px;border-radius:50%;
  background:rgba(20,32,54,.55);color:#9fd8ff;font-size:19px;border:2px solid rgba(39,64,95,.9);backdrop-filter:blur(6px)}
#touch button:active{background:rgba(0,200,255,.35)}
#tLeft{left:14px;bottom:104px}#tRight{left:94px;bottom:104px}
#tUp{right:14px;bottom:184px}#tDown{right:14px;bottom:96px}
#tHand{right:94px;bottom:140px;font-size:11px!important;color:#ff9fd0!important;border-color:#5f2740!important}
#tBoost{left:54px;bottom:184px;font-size:10px!important;color:#00e5ff!important;border-color:#1b4a5f!important}
#tAction{right:14px;bottom:264px;font-size:11px!important;color:#ffd700!important;border-color:#5f4a1b!important}
#tShoot{left:14px;bottom:264px;font-size:11px!important;color:#ff5050!important;border-color:#5f1b1b!important}
#tMenu{left:50%;top:14px;transform:translateX(-50%);width:60px!important;height:60px!important;
  font-size:11px!important;color:#ffd700!important}
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="menu">
  <div class="menuInner">
    <h1>هجولة سيتي 3D — Life</h1>
    <div class="sub">عالم مفتوح • سيارات ومشياً • متجر وأسلحة • مهام وكاش • بيت وكراج • P2P</div>
    <canvas id="preview"></canvas>
    <h3>اسمك</h3>
    <div class="row"><input id="nameIn" maxlength="14" value="هجّال"/></div>
    <h3>الخريطة</h3>
    <div id="maps"></div>
    <h3>السيارة الابتدائية</h3>
    <div id="cars"></div>
    <h3>السكن (24)</h3>
    <div id="skins"></div>
    <h3>ابدأ اللعب</h3>
    <div class="row"><button class="primary" id="btnSolo">انطلق</button></div>
    <h3>مع الأصحاب (P2P)</h3>
    <div class="row">
      <button class="ghost" id="btnHost">🏠 استضافة</button>
      <input id="codeIn" maxlength="4" placeholder="كود" style="text-transform:uppercase;text-align:center;letter-spacing:4px;max-width:90px"/>
      <button class="ghost" id="btnJoin">🔗 انضمام</button>
    </div>
    <div id="status"></div>
  </div>
</div>

<div id="hud" class="hidden">
  <div id="speedo"><span id="spd">0</span><small>كم/س</small></div>
  <div id="cashBox">💰 <b id="cash">0</b></div>
  <div id="healthBox"><small>الصحة <span id="hpTxt">100</span></small><div id="healthBar"><div id="healthFill"></div></div></div>
  <div id="stateBadge"><b id="stateTxt">في السيارة</b></div>
  <div id="crosshair"></div>
  <div id="hint"></div>
  <canvas id="minimap" width="260" height="260"></canvas>
  <div id="roomInfo"></div>
  <button id="btnExit">خروج</button>
</div>

<div id="countdown"></div>

<div id="gameMenu">
  <div class="menuWrap">
    <h2 id="gmTitle">القائمة</h2>
    <div id="gmContent"></div>
    <button class="close" id="gmClose">إغلاق</button>
  </div>
</div>

<div id="finishMsg">
  <h2 id="finishTitle">🏁 انتهى السباق</h2>
  <p id="finishSub"></p>
  <button onclick="document.getElementById('finishMsg').style.display='none'">متابعة</button>
</div>

<div id="touch" class="hidden">
  <button id="tLeft">◀</button><button id="tRight">▶</button>
  <button id="tUp">▲</button><button id="tDown">▼</button>
  <button id="tHand">هاند</button><button id="tBoost">N2O</button>
  <button id="tAction">تفاعل</button><button id="tShoot">🔫</button>
  <button id="tMenu">☰</button>
</div>

/* ===== أدوات ===== */

const lerp=(a,b,t)=>a+(b-a)*t;
const $=id=>document.getElementById(id);
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}

/* ===== بيانات ===== */
const CARS=[
 {name:'هجولة كلاسيك', hex:0xe8443a, accel:23, max:52, grip:0.862, drift:0.982, turn:2.40, style:0, price:0},

 {name:'تويوتا سوبرا', hex:0xff8c00, accel:25, max:58, grip:0.866, drift:0.978, turn:2.30, style:1, price:8000},
 {name:'فورد موستانج', hex:0xffd700, accel:27, max:55, grip:0.842, drift:0.976, turn:2.20, style:2, price:9000},

 {name:'مازدا RX-7',   hex:0x39ff14, accel:24, max:54, grip:0.832, drift:0.988, turn:2.80, style:1, price:7000},
 {name:'لامبورغيني',   hex:0xff2d95, accel:28, max:64, grip:0.876, drift:0.972, turn:2.45, style:3, price:28000},
 {name:'بورش 911',     hex:0xc8d0d8, accel:26, max:61, grip:0.880, drift:0.973, turn:2.50, style:3, price:22000},
 {name:'بي إم M3',     hex:0x1e88e5, accel:25, max:57, grip:0.870, drift:0.977, turn:2.40, style:2, price:11000},
 {name:'شاص هجولة',    hex:0xc2a06a, accel:21, max:48, grip:0.800, drift:0.992, turn:3.00, style:4, price:5000}

const SKINS=[

 {n:'أسود مطفي', c1:'#101014', c2:'#ff2d55', p:'stripe', price:700},
 {n:'سماوي',     c1:'#00b3ff', c2:'#ffffff', p:'stripe', price:400},
 {n:'توهج وردي', c1:'#ff2d95', c2:'#ffffff', p:'neon', price:900},
 {n:'صحراوي',    c1:'#c2a06a', c2:'#5a4326', p:'camo', price:500},

 {n:'نحاسي',     c1:'#b87333', c2:'#f0d8a8', p:'chrome', price:1200},

 {n:'قاتم ذهبي', c1:'#2b2b2b', c2:'#ffd700', p:'tribal', price:900}
];

// متجر
const WEAPONS=[
 {id:'pistol', name:'مسدس', price:800, dmg:25, rate:0.35, icon:'🔫'},
 {id:'smg', name:'رشاش', price:2500, dmg:18, rate:0.10, icon:'🔫'},

 {id:'potion', name:'علاج صحي', price:200, icon:'💊'},

];

];

 {id:'city', name:'المدينة', sky:[0x1a1035,0xff8a4c], fog:[0x6a5580,150,620],
  hemiColor:0x8fb4e8, hemiGround:0x2a2230, hemiInt:1.0, sunColor:0xffd0a0, sunInt:2.6,

  hemiColor:0xfff0d0, hemiGround:0xa08060, hemiInt:1.4, sunColor:0xfff5e0, sunInt:3.2,

const WORLD=720, HALF=WORLD/2;

/* ===== إعداد العرض ===== */
const canvas=$('c');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.05;
renderer.outputColorSpace=THREE.SRGBColorSpace;

const scene=new THREE.Scene();
scene.fog=new THREE.Fog(0x6a5580,150,620);
const camera=new THREE.PerspectiveCamera(64,innerWidth/innerHeight,0.4,3000);
camera.position.set(0,8,-14);

const pmrem=new THREE.PMREMGenerator(renderer);
scene.environment=pmrem.fromScene(new RoomEnvironment(),0.05).texture;

const hemi=new THREE.HemisphereLight(0x8fb4e8,0x2a2230,1.0); scene.add(hemi);
const sun=new THREE.DirectionalLight(0xffd0a0,2.6);
sun.castShadow=true;
sun.shadow.mapSize.set(2048,2048);
sun.shadow.camera.near=1; sun.shadow.camera.far=420;
sun.shadow.camera.left=-95; sun.shadow.camera.right=95;
sun.shadow.camera.top=95; sun.shadow.camera.bottom=-95;
sun.shadow.bias=-0.0005; sun.shadow.normalBias=0.6;
scene.add(sun); scene.add(sun.target);

const skyGeo=new THREE.SphereGeometry(1400,32,18);
const skyMat=new THREE.ShaderMaterial({
  side:THREE.BackSide,depthWrite:false,fog:false,
  uniforms:{top:{value:new THREE.Color(0x1a1035)},bottom:{value:new THREE.Color(0xff8a4c)}},

const skinCache={};
function getSkinMaps(idx){
  if(skinCache[idx]) return skinCache[idx];
  const skin=SKINS[idx%SKINS.length];
  const S=512;
  const c=document.createElement('canvas'); c.width=S; c.height=S;
  const g=c.getContext('2d');
  g.fillStyle=skin.c1; g.fillRect(0,0,S,S);
  const grd=g.createLinearGradient(0,0,0,S);
  grd.addColorStop(0,'rgba(255,255,255,0.22)'); grd.addColorStop(0.45,'rgba(255,255,255,0)'); grd.addColorStop(1,'rgba(0,0,0,0.32)');
  g.fillStyle=grd; g.fillRect(0,0,S,S);
  const t=skin.p;
  if(t==='stripe'){g.fillStyle=skin.c2;g.fillRect(S*0.415,0,S*0.055,S);g.fillRect(S*0.53,0,S*0.055,S);}
  else if(t==='flame'){g.fillStyle=skin.c2;for(let i=0;i<9;i++){const y=S-i*(S/9);g.beginPath();g.moveTo(0,y);g.quadraticCurveTo(S*0.3,y-S*0.14,S*0.55,y-S*0.02);g.quadraticCurveTo(S*0.8,y+S*0.06,S,y-S*0.10);g.lineTo(S,y+S*0.085);g.lineTo(0,y+S*0.085);g.closePath();g.fill();}}
  else if(t==='carbon'){for(let x=0;x<S;x+=16)for(let y=0;y<S;y+=16){g.fillStyle=(((x/16)+(y/16))%2)?'rgba(255,255,255,0.07)':'rgba(0,0,0,0.30)';g.fillRect(x,y,16,16);}g.globalAlpha=0.55;g.fillStyle=skin.c2;for(let i=0;i<6;i++)g.fillRect(0,i*S/6+8,S,4);g.globalAlpha=1;}
  else if(t==='tribal'){g.strokeStyle=skin.c2;g.lineWidth=12;g.lineCap='round';for(let i=0;i<5;i++){g.beginPath();g.moveTo(-20,i*S/5+30);g.bezierCurveTo(S*0.35,i*S/5-30,S*0.65,i*S/5+90,S+20,i*S/5+40);g.stroke();}}
  else if(t==='neon'){g.fillStyle='rgba(4,8,16,0.55)';g.fillRect(0,0,S,S);g.strokeStyle=skin.c2;g.lineWidth=16;g.lineCap='round';g.shadowColor=skin.c2;g.shadowBlur=24;for(let i=0;i<4;i++){g.beginPath();g.moveTo(0,S*0.18+i*S*0.22);g.lineTo(S,S*0.18+i*S*0.22);g.stroke();}g.strokeStyle='#fff';g.lineWidth=6;g.shadowBlur=0;for(let i=0;i<4;i++){g.beginPath();g.moveTo(0,S*0.18+i*S*0.22);g.lineTo(S,S*0.18+i*S*0.22);g.stroke();}}
  else if(t==='chrome'){const cg=g.createLinearGradient(0,0,S,S);cg.addColorStop(0,skin.c1);cg.addColorStop(0.32,'#fff');cg.addColorStop(0.5,skin.c2);cg.addColorStop(0.72,'#fff');cg.addColorStop(1,skin.c1);g.fillStyle=cg;g.fillRect(0,0,S,S);}
  else if(t==='camo'){const rnd=mulberry32(7);g.fillStyle=skin.c2;for(let i=0;i<26;i++){const x=rnd()*S,y=rnd()*S,r=20+rnd()*45;g.beginPath();g.ellipse(x,y,r,r*0.62,rnd()*3,0,6.283);g.fill();}}
  const map=new THREE.CanvasTexture(c);
  map.colorSpace=THREE.SRGBColorSpace; map.anisotropy=4;
  skinCache[idx]={map};
  return skinCache[idx];
}

function buildCarMesh(carIdx,skinIdx){
  const carDef=CARS[carIdx];
  const style=carDef.style;
  const {map}=getSkinMaps(skinIdx);
  const group=new THREE.Group();
  const body=new THREE.Group(); group.add(body);
  const paint=new THREE.MeshStandardMaterial({map,metalness:0.72,roughness:0.28,envMapIntensity:1.15});
  const add=(geo,mat,x,y,z,cast=true,rot)=>{
    const m=new THREE.Mesh(geo,mat);
    m.position.set(x,y,z);
    if(rot) m.rotation.set(rot[0],rot[1],rot[2]);
    m.castShadow=cast; m.receiveShadow=true;
    body.add(m); return m;
  };
  let trackW=0.95, wheelR=0.42, length=4.40, width=1.90, height=0.58;
  const wheels=[];
  if(style===0){
    length=4.5; width=1.92; height=0.62; wheelR=0.42; trackW=0.95;
    add(new THREE.BoxGeometry(width,height,length),paint,0,0.62,0);
    add(new THREE.BoxGeometry(width-0.08,0.28,1.55),paint,0,0.94,1.42);
    add(new THREE.BoxGeometry(width-0.08,0.28,1.15),paint,0,0.94,-1.72);
    add(new THREE.BoxGeometry(width-0.32,0.55,2.1),glassMat,0,1.14,-0.15);
    add(new THREE.BoxGeometry(width-0.44,0.10,1.7),paint,0,1.42,-0.24);
  } else if(style===1){
    length=4.35; width=1.86; height=0.55; wheelR=0.40; trackW=0.92;
    add(new THREE.BoxGeometry(width,height,length),paint,0,0.58,0);
    add(new THREE.BoxGeometry(width-0.10,0.26,1.5),paint,0,0.88,1.38);
    add(new THREE.BoxGeometry(width-0.10,0.30,1.05),paint,0,0.88,-1.68);
    add(new THREE.BoxGeometry(width-0.36,0.50,2.0),glassMat,0,1.06,-0.10);
  } else if(style===2){
    length=4.55; width=2.00; height=0.62; wheelR=0.45; trackW=1.00;
    add(new THREE.BoxGeometry(width,height,length),paint,0,0.60,0);
    add(new THREE.BoxGeometry(width-0.04,0.32,1.65),paint,0,0.92,1.40);
    add(new THREE.BoxGeometry(width-0.04,0.30,1.05),paint,0,0.92,-1.72);
    add(new THREE.BoxGeometry(width-0.38,0.50,1.9),glassMat,0,1.10,-0.12);
    add(new THREE.BoxGeometry(0.60,0.14,0.60),darkMat,0,1.10,1.30);
  } else if(style===3){
    length=4.6; width=1.98; height=0.48; wheelR=0.44; trackW=1.02;
    add(new THREE.BoxGeometry(width,height,length),paint,0,0.52,0);
    add(new THREE.BoxGeometry(width-0.10,0.20,1.7),paint,0,0.78,1.45);
    add(new THREE.BoxGeometry(width-0.10,0.26,1.1),paint,0,0.78,-1.78);
    add(new THREE.BoxGeometry(width-0.44,0.42,1.7),glassMat,0,1.00,-0.15);
    add(new THREE.BoxGeometry(0.10,0.34,0.16),darkMat,0.70,1.06,-1.98);
    add(new THREE.BoxGeometry(0.10,0.34,0.16),darkMat,-0.70,1.06,-1.98);
    add(new THREE.BoxGeometry(1.80,0.07,0.50),paint,0,1.24,-1.98);
  } else {
    length=4.7; width=2.05; height=0.78; wheelR=0.55; trackW=1.02;
    add(new THREE.BoxGeometry(width,height,length),paint,0,0.72,0);
    add(new THREE.BoxGeometry(width-0.10,0.42,1.55),paint,0,1.10,1.45);
    add(new THREE.BoxGeometry(width-0.10,0.36,1.05),paint,0,1.10,-1.75);
    add(new THREE.BoxGeometry(width-0.32,0.55,2.1),glassMat,0,1.35,-0.10);
  }
  add(new THREE.BoxGeometry(width+0.08,0.30,0.40),darkMat,0,0.42,length/2-0.02);
  add(new THREE.BoxGeometry(width+0.08,0.30,0.40),darkMat,0,0.42,-length/2+0.02);
  add(new THREE.BoxGeometry(0.14,0.16,length*0.55),darkMat, width/2-0.02,0.38,0);
  add(new THREE.BoxGeometry(0.14,0.16,length*0.55),darkMat,-width/2+0.02,0.38,0);
  add(new THREE.BoxGeometry(0.44,0.16,0.10),headMat, width/2-0.35,0.72,length/2-0.02,false);
  add(new THREE.BoxGeometry(0.44,0.16,0.10),headMat,-width/2+0.35,0.72,length/2-0.02,false);
  add(new THREE.BoxGeometry(0.52,0.14,0.10),tailMat, width/2-0.35,0.76,-length/2+0.02,false);
  add(new THREE.BoxGeometry(0.52,0.14,0.10),tailMat,-width/2+0.35,0.76,-length/2+0.02,false);
  const wbF=length/2-0.95, wbR=-length/2+0.95;
  const pos=[[trackW,wbF],[-trackW,wbF],[trackW,wbR],[-trackW,wbR]];
  for(const [wx,wz] of pos){
    const pivot=new THREE.Group();
    pivot.position.set(wx,wheelR,wz);
    const spin=new THREE.Group();
    const tire=new THREE.Mesh(wheelGeo,tireMat); tire.castShadow=true;
    tire.scale.set(1,wheelR/0.42,wheelR/0.42);
    const rim=new THREE.Mesh(rimGeo,rimMat); rim.scale.set(1,wheelR/0.42,wheelR/0.42);
    spin.add(tire); spin.add(rim);
    pivot.add(spin); group.add(pivot);
    wheels.push({pivot,spin,front:wz>0});
  }
  return {group,body,wheels,length,width};
}

  cross2.position.set(0,7,5.2);

  for(let i=0;i<8;i++){

  for(let i=0;i<6;i++){
    const x=(rnd()-0.5)*500, z=(rnd()-0.5)*500;
    spawnMissionObject(x,z);
  }

  // أشجار المدينة
  if(map.groundType==='grass'){
    const treePositions=[];
    for(let i=0;i<100;i++){

function makeTextSprite(text, color='#ffffff', fontSize=100, scale=3){
  const c=document.createElement('canvas'); c.width=512; c.height=128;
  const g=c.getContext('2d');
  g.font=`bold ${fontSize}px Tahoma`; g.textAlign='center'; g.textBaseline='middle';
  g.shadowColor='#000'; g.shadowBlur=12;
  g.fillStyle=color; g.fillText(text,256,64);
  const tex=new THREE.CanvasTexture(c); tex.colorSpace=THREE.SRGBColorSpace;
  const sp=new THREE.Sprite(new THREE.SpriteMaterial({map:tex,transparent:true,depthWrite:false}));
  sp.scale.set(scale*2.5,scale*0.625,1);

function makeWindowTextures(){
  const S=256;
  const alb=document.createElement('canvas'); alb.width=alb.height=S;
  const a=alb.getContext('2d');
  const emi=document.createElement('canvas'); emi.width=emi.height=S;
  const e=emi.getContext('2d');
  a.fillStyle='#141a26'; a.fillRect(0,0,S,S);
  e.fillStyle='#000'; e.fillRect(0,0,S,S);
  const cols=6,rows=6,m=8;
  const cw=(S-m*2)/cols,ch=(S-m*2)/rows;
  const rnd=mulberry32(99);
  for(let i=0;i<cols;i++) for(let j=0;j<rows;j++){
    const x=m+i*cw+2,y=m+j*ch+2,w=cw-4,h=ch-4;
    a.fillStyle='#26334a'; a.fillRect(x,y,w,h);
    if(rnd()>0.42){
      const warm=rnd()>0.35;
      e.fillStyle=warm?'rgba(255,196,110,0.7)':'rgba(150,220,255,0.6)';
      e.fillRect(x,y,w,h);
    }
  }
  const t1=new THREE.CanvasTexture(alb); t1.colorSpace=THREE.SRGBColorSpace;
  const t2=new THREE.CanvasTexture(emi); t2.colorSpace=THREE.SRGBColorSpace;
  t1.wrapS=t1.wrapT=t2.wrapS=t2.wrapT=THREE.RepeatWrapping;
  return {alb:t1,emi:t2};
}

function buildingGeo(w,h,d,tile){
  const g=new THREE.BoxGeometry(w,h,d);
  const uv=g.attributes.uv;
  const sc=[[d/tile,h/tile],[d/tile,h/tile],[0.001,0.001],[0.001,0.001],[w/tile,h/tile],[w/tile,h/tile]];
  for(let f=0;f<6;f++){
    const su=sc[f][0],sv=sc[f][1];
    for(let i=0;i<4;i++){const k=f*4+i;uv.setXY(k,uv.getX(k)*su,uv.getY(k)*sv);}
  }
  uv.needsUpdate=true;
  return g;
}

function buildTrees(positions,leafColor,trunkColor){
  if(positions.length===0) return;
  const trunkGeo=new THREE.CylinderGeometry(0.16,0.24,2.2,6);
  const trunkMat=new THREE.MeshStandardMaterial({color:trunkColor,roughness:1});
  const leafGeo=new THREE.ConeGeometry(1.55,3.5,7);
  const leafMat=new THREE.MeshStandardMaterial({color:leafColor,roughness:1});
  const trunks=new THREE.InstancedMesh(trunkGeo,trunkMat,positions.length);
  const leaves=new THREE.InstancedMesh(leafGeo,leafMat,positions.length);
  trunks.castShadow=leaves.castShadow=true;
  const m=new THREE.Object3D();
  positions.forEach((p,i)=>{
    m.position.set(p[0],1.1,p[1]); m.rotation.set(0,0,0); m.scale.set(1,1,1); m.updateMatrix();
    trunks.setMatrixAt(i,m.matrix);
    m.position.set(p[0],4.0,p[1]); m.updateMatrix();
    leaves.setMatrixAt(i,m.matrix);
  });
  trunks.instanceMatrix.needsUpdate=true; leaves.instanceMatrix.needsUpdate=true;
  worldGroup.add(trunks); worldGroup.add(leaves);
}

const SMOKE_N=300;
const smokePos=new Float32Array(SMOKE_N*3);
const smokeSize=new Float32Array(SMOKE_N);
const smokeAlpha=new Float32Array(SMOKE_N);
const smokeColor=new Float32Array(SMOKE_N*3);
const smokeData=[];
for(let i=0;i<SMOKE_N;i++){smokeData.push({life:0,max:1,vx:0,vy:0,vz:0});smokePos[i*3+1]=-999;}
function makeSmokeTex(){
  const S=64,c=document.createElement('canvas'); c.width=c.height=S;
  const g=c.getContext('2d');
  const grd=g.createRadialGradient(S/2,S/2,0,S/2,S/2,S/2);
  grd.addColorStop(0,'rgba(255,255,255,0.9)'); grd.addColorStop(0.45,'rgba(255,255,255,0.35)'); grd.addColorStop(1,'rgba(255,255,255,0)');
  g.fillStyle=grd; g.fillRect(0,0,S,S);
  return new THREE.CanvasTexture(c);
}
const smokeGeo=new THREE.BufferGeometry();
smokeGeo.setAttribute('position',new THREE.BufferAttribute(smokePos,3));
smokeGeo.setAttribute('aSize',new THREE.BufferAttribute(smokeSize,1));
smokeGeo.setAttribute('aAlpha',new THREE.BufferAttribute(smokeAlpha,1));
smokeGeo.setAttribute('aColor',new THREE.BufferAttribute(smokeColor,3));
const smokeMat=new THREE.ShaderMaterial({
  uniforms:{uTex:{value:makeSmokeTex()}},
  vertexShader:`attribute float aSize;attribute float aAlpha;attribute vec3 aColor;
    varying float vA;varying vec3 vC;
    void main(){vA=aAlpha;vC=aColor;vec4 mv=modelViewMatrix*vec4(position,1.0);
    gl_PointSize=aSize*(320.0/max(1.0,-mv.z));gl_Position=projectionMatrix*mv;}`,
  fragmentShader:`uniform sampler2D uTex;varying float vA;varying vec3 vC;
    void main(){vec4 t=texture2D(uTex,gl_PointCoord);
    if(t.a*vA<0.01) discard;
    gl_FragColor=vec4(vC,t.a*vA);}`,
  transparent:true,depthWrite:false
});
const smokePoints=new THREE.Points(smokeGeo,smokeMat);
smokePoints.frustumCulled=false;
scene.add(smokePoints);
let smokeCursor=0;
function spawnSmoke(x,y,z,vx,vz,color=[0.86,0.88,0.92],sizeMul=1,lifeMul=1){
  const i=smokeCursor; smokeCursor=(smokeCursor+1)%SMOKE_N;
  const d=smokeData[i];
  d.life=d.max=(0.85+Math.random()*0.6)*lifeMul;
  d.vx=vx*0.22+(Math.random()-0.5)*1.6;
  d.vy=0.7+Math.random()*0.9;
  d.vz=vz*0.22+(Math.random()-0.5)*1.6;
  smokePos[i*3]=x; smokePos[i*3+1]=y; smokePos[i*3+2]=z;
  smokeSize[i]=(1.4+Math.random()*1.6)*sizeMul;
  smokeAlpha[i]=0.65;
  smokeColor[i*3]=color[0]; smokeColor[i*3+1]=color[1]; smokeColor[i*3+2]=color[2];
}
function updateSmoke(dt){
  for(let i=0;i<SMOKE_N;i++){
    const d=smokeData[i];
    if(d.life<=0){smokeAlpha[i]=0;continue;}
    d.life-=dt;
    smokePos[i*3]+=d.vx*dt; smokePos[i*3+1]+=d.vy*dt; smokePos[i*3+2]+=d.vz*dt;
    d.vx*=0.96; d.vz*=0.96; d.vy*=0.97;
    smokeSize[i]+=dt*2.2;
    smokeAlpha[i]=Math.max(0,d.life/d.max)*0.6;
  }
  smokeGeo.attributes.position.needsUpdate=true;
  smokeGeo.attributes.aSize.needsUpdate=true;
  smokeGeo.attributes.aAlpha.needsUpdate=true;
  smokeGeo.attributes.aColor.needsUpdate=true;
}

const input={up:false,down:false,left:false,right:false,hand:false,boost:false,action:false,shoot:false};
let actionJustPressed=false;
const playerChar=buildCharacterMesh();
scene.add(playerChar.group);
playerChar.group.visible=false;

// سيارة اللاعب المشاة
let playerCarMesh=null;

/* ===== تحرك اللاعب ===== */
function updatePlayer(dt){
  const p=game.player;

  if(p.inVehicle){
    // في السيارة - فيزياء القيادة
    updateCarPhysics(p, dt);
    p.pos.set(p.x, 0, p.z);
  } else {
    // مشياً
    updateWalkPhysics(p, dt);
  }

  // إعادة الشحن
  if(p.shootCooldown>0) p.shootCooldown-=dt;
}

function updateWalkPhysics(p, dt){
  const st={accel:32, max:9, turn:6};
  const sinA=Math.sin(p.angle), cosA=Math.cos(p.angle);
  let fwd=p.vx*sinA+p.vz*cosA;
  let side=p.vx*cosA-p.vz*sinA;

  const throttle=input.up?1:0, brake=input.down?1:0;
  const steer=(input.right?1:0)-(input.left?1:0);
  const run=input.boost;

  if(throttle) fwd+=st.accel*(run?1.6:1)*dt;
  if(brake) fwd-=st.accel*0.8*dt;

  fwd*=Math.pow(0.88,dt*60);
  if(!throttle&&!brake) fwd*=Math.pow(0.92,dt*60);
  fwd=clamp(fwd,-st.max*0.5,st.max*(run?1.7:1));

  const spdAbs=Math.abs(fwd);
  const steerRate=st.turn*Math.min(1,spdAbs/5);
  p.angle-=steer*steerRate*dt*(fwd<0?-1:1);

  side*=Math.pow(0.80,dt*60);

  p.vx=fwd*sinA+side*cosA;
  p.vz=fwd*cosA-side*sinA;
  p.pos.x+=p.vx*dt;
  p.pos.z+=p.vz*dt;
  p.pos.x=clamp(p.pos.x,-HALF+3,HALF-3);
  p.pos.z=clamp(p.pos.z,-HALF+3,HALF-3);

  // تصادم
  const r=0.9;
  for(const b of collisionBoxes){
    const cx=clamp(p.pos.x,b.minX,b.maxX);
    const cz=clamp(p.pos.z,b.minZ,b.maxZ);
    let dx=p.pos.x-cx, dz=p.pos.z-cz;
    const d2=dx*dx+dz*dz;
    if(d2<r*r){
      let d=Math.sqrt(d2);
      if(d<0.0001){dx=1;dz=0;d=1;}
      const nx=dx/d, nz=dz/d;
      p.pos.x=cx+nx*r; p.pos.z=cz+nz*r;
      const vn=p.vx*nx+p.vz*nz;
      if(vn<0){p.vx-=vn*nx*1.2;p.vz-=vn*nz*1.2;}
    }
  }

  p.speed=Math.hypot(p.vx,p.vz);
  p.walkAnim+=p.speed*dt*2;

  // تحديث الشخصية
  playerChar.group.position.copy(p.pos);
  playerChar.group.rotation.y=p.angle;
  const legSwing=Math.sin(p.walkAnim*3)*0.7*Math.min(1,p.speed/3);
  playerChar.legL.rotation.x=legSwing;
  playerChar.legR.rotation.x=-legSwing;
  playerChar.armL.rotation.x=-legSwing*0.6;
  playerChar.armR.rotation.x=legSwing*0.6;
  // القفز
  if(p.vy!==0 || p.pos.y>0){
    p.pos.y+=p.vy*dt;
    p.vy-=25*dt;
    if(p.pos.y<=0){p.pos.y=0;p.vy=0;}
    playerChar.group.position.y=p.pos.y;
  }

  playerChar.group.visible=true;

  // البحث عن سيارة قريبة
  p.nearCar=null;
  let bestDist=6;
  for(const car of game.vehicles){
    if(car.isPlayer) continue;
    const d=Math.hypot(car.x-p.pos.x, car.z-p.pos.z);
    if(d<bestDist){bestDist=d; p.nearCar=car;}
  }
  // البحث عن مبنى قابل للتفاعل
  p.nearBuilding=null;
  for(const b of game.buildings){
    if(!b.interactable) continue;
    const d=Math.hypot(b.x-p.pos.x, b.z-p.pos.z);
    if(d<8){p.nearBuilding=b;break;}
  }
  // البحث عن NPC
  p.nearNpc=null;
  for(const n of game.npcs){
    const d=Math.hypot(n.x-p.pos.x, n.z-p.pos.z);
    if(d<4){p.nearNpc=n;break;}
  }
}

function updateCarPhysics(p, dt){
  const car=game.vehicles.find(v=>v.isPlayer);
  if(!car) return;
  const st=CARS[car.carIdx];
  const sinA=Math.sin(car.angle), cosA=Math.cos(car.angle);
  let fwd=car.vx*sinA+car.vz*cosA;
  let side=car.vx*cosA-car.vz*sinA;

  const throttle=input.up?1:0, brake=input.down?1:0;
  const steer=(input.right?1:0)-(input.left?1:0);
  const hand=input.hand;
  const wantBoost=input.boost&&p.nitro>0.02&&fwd>1;
  p.boost=wantBoost;
  if(wantBoost) p.nitro=Math.max(0,p.nitro-dt*0.42);
  else if(p.driftTimer>0.3) p.nitro=Math.min(1,p.nitro+dt*0.30);
  else p.nitro=Math.min(1,p.nitro+dt*0.11);

  if(throttle) fwd+=st.accel*dt*(wantBoost?2.0:1.0);
  if(brake) fwd-=(fwd>1?st.accel*1.7:st.accel*0.6)*dt;
  fwd*=Math.pow(0.995,dt*60);
  if(!throttle&&!brake) fwd*=Math.pow(0.987,dt*60);
  if(hand) fwd*=Math.pow(0.992,dt*60);

  const maxSpd=st.max*(wantBoost?1.35:1);
  fwd=clamp(fwd,-st.max*0.30,maxSpd);

  const spdAbs=Math.abs(fwd);
  const steerRate=st.turn*Math.min(1,spdAbs/11)*(hand?1.5:1);
  car.angle-=steer*steerRate*dt*(fwd<0?-1:1);

  const gripF=hand?st.drift:st.grip;
  side*=Math.pow(gripF,dt*60);

  car.vx=fwd*sinA+side*cosA;
  car.vz=fwd*cosA-side*sinA;
  car.x+=car.vx*dt;
  car.z+=car.vz*dt;
  car.speed=Math.hypot(car.vx,car.vz);
  car.side=side;

  p.x=car.x; p.z=car.z; p.angle=car.angle;
  p.speed=car.speed; p.side=side;

  const lim=HALF-3;
  car.x=clamp(car.x,-lim,lim); car.z=clamp(car.z,-lim,lim);

  const r=1.9;
  for(const b of collisionBoxes){
    const cx=clamp(car.x,b.minX,b.maxX);
    const cz=clamp(car.z,b.minZ,b.maxZ);
    let dx=car.x-cx, dz=car.z-cz;
    const d2=dx*dx+dz*dz;
    if(d2<r*r){
      let d=Math.sqrt(d2);
      if(d<0.0001){dx=1;dz=0;d=1;}
      const nx=dx/d,nz=dz/d;
      car.x=cx+nx*r; car.z=cz+nz*r;
      const vn=car.vx*nx+car.vz*nz;
      if(vn<0){car.vx-=vn*nx*1.45;car.vz-=vn*nz*1.45;}
    }
  }

  const slipping=Math.abs(side)>4.2 && car.speed>9;
  if(slipping&&(hand||Math.abs(steer)>0)){
    p.driftTimer+=dt;
    p.combo=Math.min(5,1+p.driftTimer*0.55);
    p.score+=Math.abs(side)*dt*2.4*p.combo;
  } else {
    p.idleTimer=(p.idleTimer||0)+dt;
    if(p.idleTimer>0.9){p.driftTimer=0;p.combo=1;}
  }

  // تأثيرات
  car.mesh.group.position.set(car.x,0,car.z);
  car.mesh.group.rotation.y=car.angle;
  const roll=clamp(-side*0.010,-0.13,0.13);
  car.mesh.body.rotation.z=lerp(car.mesh.body.rotation.z,roll,Math.min(1,dt*8));
  const wheelSpin=car.speed*dt*2.4;
  const steerAngle=(input.right?1:0)-(input.left?1:0);
  for(const w of car.mesh.wheels){
    w.spin.rotation.x+=wheelSpin;
    if(w.front) w.pivot.rotation.y=-steerAngle*0.42;
  }

  if(Math.abs(side)>4.2&&car.speed>9){
    const s=Math.sin(car.angle),c=Math.cos(car.angle);
    const rx=c,rz=-s;
    for(const sx of [-0.95,0.95]){
      const px=car.x+rx*sx-s*1.45, pz=car.z+rz*sx-c*1.45;
      if(Math.random()<0.75) spawnSmoke(px,0.25,pz,-car.vx,-car.vz);
    }
  }
  if(p.boost){
    const s=Math.sin(car.angle),c=Math.cos(car.angle);
    for(const sx of [-0.48,0.48]){
      const px=car.x+c*sx-s*2.35, pz=car.z-s*sx-c*2.35;
      if(Math.random()<0.6) spawnSmoke(px,0.4,pz,-s*6,-c*6,[1.0,0.5,0.1],0.6,0.35);
    }
  }
}

function tryEnterCar(){
  const p=game.player;
  if(p.inVehicle) return;
  if(!p.nearCar){
    // حاول الرجوع لسيارته الأساسية
    const myCar=game.vehicles.find(v=>v.isPlayer);
    if(myCar && Math.hypot(myCar.x-p.pos.x,myCar.z-p.pos.z)<5){
      p.inVehicle=true;
      playerChar.group.visible=false;
      if(playerCarMesh){ playerCarMesh.group.visible=true; }
      return;
    }
    showHint('لا توجد سيارة قريبة');
    return;
  }
  p.inVehicle=true;
  playerChar.group.visible=false;
  const car=p.nearCar;
  // تبديل السيارة
  car.isPlayer=true;
  car.occupied=true;
  p.carIdx=car.carIdx;
  p.skinIdx=car.skinIdx;
  p.pos.set(car.x,0,car.z);
  p.angle=car.angle;
  showHint('ركبت السيارة!');
}

function interactWithBuilding(){

  const b=p.nearBuilding;
  if(b.type==='shop'){ openShop(); }

function interactWithNpc(){

}

/* ===== متجر ===== */
function openShop(){

  $('gmTitle').textContent='🛒 المتجر';

      <button class="buy" data-buy="consumable" data-id="${c.id}" data-price="${c.price}">شراء</button></div>`;
  }
  html+='</div>';

  for(const pr of PROPERTIES){
    const owned=game.player.ownedProperties.includes(pr.id);
    html+=`<div class="itemRow"><div><b>${pr.icon} ${pr.name}</b><small>سعر ${pr.price}</small></div>
      <button class="buy" ${owned?'disabled':''} data-buy="property" data-id="${pr.id}" data-price="${pr.price}">
        ${owned?'مُملوك':'شراء'}</button></div>`;
  }
  html+='</div>';
  content.innerHTML=html;
  bindShopButtons();
  $('gameMenu').style.display='block';
}

function bindShopButtons(){
  document.querySelectorAll('[data-buy]').forEach(btn=>{
    btn.onclick=()=>{
      const type=btn.dataset.buy;
      const id=btn.dataset.id;
      const price=parseInt(btn.dataset.price);
      if(game.player.cash<price){
        btn.style.background='#5a1010';
        setTimeout(()=>btn.style.background='',500);
        return;
      }
      game.player.cash-=price;
      if(type==='weapon'){
        if(!game.player.ownedWeapons.includes(id)){
          game.player.ownedWeapons.push(id);
          game.player.ammo[id]=100;
          game.player.currentWeapon=id;
          playerChar.gunGroup.visible=true;
        }
      } else if(type==='consumable'){
        game.player.ownedConsumables[id]=(game.player.ownedConsumables[id]||0)+1;
      } else if(type==='property'){
        game.player.ownedProperties.push(id);
      }
      updateHUD();
      openShop(); // تحديث
    };
  });
}

/* ===== إطلاق النار ===== */
function shoot(){
  const p=game.player;
  if(p.shootCooldown>0||!p.currentWeapon) return;
  const w=WEAPONS.find(x=>x.id===p.currentWeapon);
  if(!w) return;
  if((p.ammo[p.currentWeapon]||0)<=0){ showHint('لا يوجد ذخيرة!'); return; }
  p.ammo[p.currentWeapon]--;
  p.shootCooldown=w.rate;

  const from=new THREE.Vector3(p.pos.x, 1.5, p.pos.z);
  const dir=new THREE.Vector3(Math.sin(p.angle),0,Math.cos(p.angle));
  fireBullet(from,dir,w.dmg);

  // وميض
  spawnSmoke(from.x,from.y,from.z,0,0,[1,0.8,0.2],0.5,0.15);

  // تأثير اهتزاز
  cameraShake=0.15;
}

/* ===== التصادم ===== */
let cameraShake=0;
let _v1=new THREE.Vector3(), _v2=new THREE.Vector3(), _v3=new THREE.Vector3();

function updateProjectiles(dt){
  for(let i=game.projectiles.length-1;i>=0;i--){
    const pr=game.projectiles[i];
    pr.mesh.position.addScaledVector(pr.dir, pr.speed*dt);
    pr.life-=dt;
    if(pr.life<=0){
      scene.remove(pr.mesh);
      game.projectiles.splice(i,1);
      continue;
    }
    // اصطدام مع NPCs
    let hit=false;
    for(const npc of game.npcs){
      const d=Math.hypot(npc.x-pr.mesh.position.x, npc.z-pr.mesh.position.z);
      if(d<1.2){
        npc.health-=pr.dmg;
        spawnSmoke(pr.mesh.position.x,pr.mesh.position.y,pr.mesh.position.z,0,0,[1,0.2,0.2],1,0.4);
        if(npc.health<=0){
          npc.mesh.group.visible=false;
          game.player.cash+=200;
          updateHUD();
          showHint('💰 +200$');
        }
        hit=true; break;
      }
    }
    if(hit){
      scene.remove(pr.mesh);
      game.projectiles.splice(i,1);
    }
  }
}

/* ===== NPCs ===== */
function updateNPCs(dt){
  for(const npc of game.npcs){
    if(npc.health<=0||!npc.mesh.group.visible) continue;
    if(npc.type==='pedestrian'){
      // حركة عشوائية
      npc.cooldown-=dt;
      if(npc.cooldown<=0){
        npc.cooldown=2+Math.random()*4;
        if(Math.random()<0.4){
          npc.targetX=npc.x+(Math.random()-0.5)*30;
          npc.targetZ=npc.z+(Math.random()-0.5)*30;
        }
      }
      const dx=npc.targetX-npc.x, dz=npc.targetZ-npc.z;
      const d=Math.hypot(dx,dz);
      if(d>1){
        const angle=Math.atan2(dx,dz);
        npc.x+=Math.sin(angle)*dt*2;
        npc.z+=Math.cos(angle)*dt*2;
        npc.targetAngle=angle;
        npc.walkAnim+=dt*4;
        const swing=Math.sin(npc.walkAnim)*0.5;
        npc.mesh.legL.rotation.x=swing;
        npc.mesh.legR.rotation.x=-swing;
      }
      npc.mesh.group.position.set(npc.x,0,npc.z);
      let da=((npc.targetAngle-npc.mesh.group.rotation.y+Math.PI*3)%(Math.PI*2))-Math.PI;
      npc.mesh.group.rotation.y+=da*Math.min(1,dt*5);
    }
  }
}

/* ===== المهام ===== */
function updateMissions(dt){
  const p=game.player;
  if(p.activeMission){
    const m=p.activeMission;
    if(m.type===0){ /* جمع صناديق — يتم في مكان آخر */ }
    else if(m.type===1){
      m.progress=Math.floor(p.score - m.startScore);
      if(m.progress>=m.need){
        p.cash+=m.reward;
        p.activeMission=null;
        updateHUD();
        showHint(`🏆 أنجزت المهمة! +${m.reward}$`);
      }
    }
    else if(m.type===2){ /* قتل — يتم في مكان آخر */ }
  }
  // جمع الصناديق
  for(let i=game.missions.length-1;i>=0;i--){
    const obj=game.missions[i];
    if(obj.collected) continue;
    obj.mesh.rotation.y+=dt*1.5;
    const d=Math.hypot(obj.x-p.pos.x, obj.z-p.pos.z);
    if(d<2){
      obj.collected=true;
      obj.mesh.visible=false;
      if(p.activeMission&&p.activeMission.type===0){
        p.activeMission.progress++;
        if(p.activeMission.progress>=p.activeMission.need){
          p.cash+=p.activeMission.reward;
          showHint(`🏆 أنجزت المهمة! +${p.activeMission.reward}$`);
          p.activeMission=null;
        } else {
          showHint(`📦 ${p.activeMission.progress}/${p.activeMission.need}`);
        }
        updateHUD();
      } else {
        p.cash+=100;
        updateHUD();
        showHint('💰 +100$');
      }
    }
  }
}

/* ===== الكاميرا ===== */
function updateCamera(dt){
  const p=game.player;
  if(p.inVehicle){
    const a=p.angle;
    const fwd=_v1.set(Math.sin(a),0,Math.cos(a));
    if(p.speed>6){
      _v2.set(p.vx,0,p.vz).normalize();
      fwd.lerp(_v2,p.driftTimer>0.25?0.42:0.12).normalize();
    }
    const back=9.8+Math.min(p.speed,60)*0.075;
    const height=4.3+Math.min(p.speed,60)*0.022;
    _v3.set(p.pos.x,0,p.pos.z).addScaledVector(fwd,-back);
    _v3.y=height;
    camera.position.lerp(_v3,1-Math.exp(-7.5*dt));
    _v3.set(p.pos.x,1.35,p.pos.z).addScaledVector(fwd,7.5);
    camera.lookAt(_v3);
  } else {
    // كاميرا خلفية للمشاة
    const a=p.angle;
    const fwd=_v1.set(Math.sin(a),0,Math.cos(a));
    _v3.set(p.pos.x,0,p.pos.z).addScaledVector(fwd,-5.5);
    _v3.y=3.2;
    camera.position.lerp(_v3,1-Math.exp(-9*dt));
    _v3.set(p.pos.x,1.6,p.pos.z).addScaledVector(fwd,3);
    camera.lookAt(_v3);
  }
  if(cameraShake>0.01){
    camera.position.x+=(Math.random()-0.5)*cameraShake*0.8;
    camera.position.y+=(Math.random()-0.5)*cameraShake*0.5;
  }
  cameraShake*=Math.pow(0.90,dt*60);
}

/* ===== HUD ===== */
const mm=$('minimap'), mmc=mm.getContext('2d');
function drawMinimap(){
  const S=mm.width, k=S/WORLD;
  mmc.clearRect(0,0,S,S);
  mmc.fillStyle='rgba(6,12,22,0.88)'; mmc.fillRect(0,0,S,S);

  // مباني
  mmc.fillStyle='#2b3a52';
  for(const b of game.buildings){
    if(b.type==='building'){
      mmc.fillRect(S/2+b.cx*k-b.w*k/2, S/2+b.cz*k-b.d*k/2, b.w*k, b.d*k);
    }
  }
  // بيوت
  const specials=[['house','#ffd700'],['garage','#00e5ff'],['shop','#ff2d95'],['hospital','#ff2222']];
  for(const [type,color] of specials){
    const b=game.buildings.find(x=>x.type===type);
    if(b){
      mmc.fillStyle=color;
      mmc.beginPath(); mmc.arc(S/2+b.x*k,S/2+b.z*k,4,0,6.283); mmc.fill();
    }
  }
  // صناديق
  mmc.fillStyle='#ffaa00';
  for(const m of game.missions){
    if(!m.collected){
      mmc.beginPath(); mmc.arc(S/2+m.x*k,S/2+m.z*k,3,0,6.283); mmc.fill();
    }
  }
  // NPCs
  for(const n of game.npcs){
    if(n.health<=0) continue;
    mmc.fillStyle=n.type==='mission'?'#ffd700':'#888';
    mmc.beginPath(); mmc.arc(S/2+n.x*k,S/2+n.z*k,2.5,0,6.283); mmc.fill();
  }
  // اللاعب
  const px=S/2+game.player.pos.x*k, pz=S/2+game.player.pos.z*k;
  const dx=Math.sin(game.player.angle), dz=Math.cos(game.player.angle);
  mmc.fillStyle='#00e5ff'; mmc.shadowColor='#00e5ff'; mmc.shadowBlur=12;
  mmc.beginPath();
  mmc.moveTo(px+dx*10, pz+dz*10);
  mmc.lineTo(px-dx*5+dz*6, pz-dz*5-dx*6);
  mmc.lineTo(px-dx*5-dz*6, pz-dz*5+dx*6);
  mmc.closePath(); mmc.fill();
  mmc.shadowBlur=0;
}

function updateHUD(){
  const p=game.player;
  $('spd').textContent=Math.round(p.speed*3.6);
  $('cash').textContent=p.cash;
  $('hpTxt').textContent=Math.round(p.health);
  $('healthFill').style.width=(p.health/p.maxHealth*100)+'%';
  $('stateTxt').textContent=p.inVehicle?'في السيارة':'مشياً';
  $('stateBadge').classList.toggle('walking',!p.inVehicle);
  drawMinimap();

  // تلميحات
  let hintText='';
  if(!p.inVehicle){
    if(p.nearCar) hintText='اضغط [E] لركوب السيارة';
    else if(p.nearBuilding) hintText='اضغط [E] للتفاعل مع '+({house:'البيت',garage:'الكراج',shop:'المتجر',hospital:'المستشفى'})[p.nearBuilding.type];
    else if(p.nearNpc&&p.nearNpc.type==='mission') hintText='اضغط [E] لفتح المهمة';
    else if(p.nearNpc) hintText='شخص عادي';
  } else {
    hintText='اضغط [E] للنزول • [Click] إطلاق النار';
  }
  if(p.activeMission) hintText+=' • مهمة: '+p.activeMission.progress+'/'+p.activeMission.need;
  const h=$('hint');
  if(hintText){ h.textContent=hintText; h.style.display='block'; }
  else h.style.display='none';

  $('crosshair').style.display=(!p.inVehicle&&p.currentWeapon)?'block':'none';
}

function showHint(text){
  const h=$('hint');
  h.textContent=text; h.style.display='block';
  clearTimeout(h._t);
  h._t=setTimeout(()=>{h.style.display='none';},2500);
}

/* ===== الحلقة ===== */
let lastT=performance.now();
function loop(t){
  requestAnimationFrame(loop);
  const dt=Math.min(0.045,(t-lastT)/1000);
  lastT=t;

  if(game.state==='playing'){
    updatePlayer(dt);
    updateCamera(dt);
    updateNPCs(dt);
    updateProjectiles(dt);
    updateMissions(dt);
    updateSmoke(dt);
    sun.position.set(game.player.pos.x+70,115,game.player.pos.z+45);
    sun.target.position.set(game.player.pos.x,0,game.player.pos.z);
    sun.target.updateMatrixWorld();
    updateHUD();
  } else {
    updateMenuCamera(dt);
    updateSmoke(dt);
  }

  sky.position.copy(camera.position);
  composer.render();
}
requestAnimationFrame(loop);

/* ===== كاميرا القائمة ===== */
let menuCamAngle=0;
function updateMenuCamera(dt){
  menuCamAngle+=dt*0.14;
  const R=115;
  camera.position.set(Math.cos(menuCamAngle)*R, 42+Math.sin(menuCamAngle*0.6)*10, Math.sin(menuCamAngle)*R);
  camera.lookAt(0,6,0);
  if(camera.fov!==62){ camera.fov=62; camera.updateProjectionMatrix(); }
}

/* ===== إدخال ===== */
addEventListener('keydown',e=>{
  if(e.code==='KeyW'||e.code==='ArrowUp') input.up=true;
  if(e.code==='KeyS'||e.code==='ArrowDown') input.down=true;
  if(e.code==='KeyA'||e.code==='ArrowLeft') input.left=true;
  if(e.code==='KeyD'||e.code==='ArrowRight') input.right=true;
  if(e.code==='Space'){ input.hand=true; e.preventDefault(); }
  if(e.code==='ShiftLeft'||e.code==='ShiftRight') input.boost=true;
  if(e.code==='KeyE'){ handleAction(); }
  if(e.code==='KeyR'){ tryEnterCar(); }
  if(e.code==='KeyF'){ tryExitCar(); }
});
addEventListener('keyup',e=>{
  if(e.code==='KeyW'||e.code==='ArrowUp') input.up=false;
  if(e.code==='KeyS'||e.code==='ArrowDown') input.down=false;
  if(e.code==='KeyA'||e.code==='ArrowLeft') input.left=false;
  if(e.code==='KeyD'||e.code==='ArrowRight') input.right=false;
  if(e.code==='Space') input.hand=false;
  if(e.code==='ShiftLeft'||e.code==='ShiftRight') input.boost=false;
});
addEventListener('mousedown',e=>{
  if(game.state==='playing' && !game.player.inVehicle && game.player.currentWeapon && e.button===0){
    shoot();
  }
});
addEventListener('touchstart',e=>{
  if(game.state==='playing' && !game.player.inVehicle && game.player.currentWeapon){
    const t=e.touches[0];
    if(t.clientX>innerWidth*0.5) shoot();
  }
},{passive:true});

function handleAction(){
  const p=game.player;
  if(p.inVehicle){
    tryExitCar();
  } else if(p.nearCar){
    tryEnterCar();
  } else if(p.nearBuilding){
    interactWithBuilding();
  } else if(p.nearNpc){
    interactWithNpc();
  } else {
    showHint('لا يوجد شيء قريب');
  }
}

function bindTouch(id,key){
  const el=$(id);
  const on=e=>{e.preventDefault();input[key]=true;};
  const off=e=>{e.preventDefault();input[key]=false;};
  el.addEventListener('pointerdown',on);
  el.addEventListener('pointerup',off);
  el.addEventListener('pointercancel',off);
  el.addEventListener('pointerleave',off);
}
bindTouch('tLeft','left'); bindTouch('tRight','right');
bindTouch('tUp','up'); bindTouch('tDown','down');
bindTouch('tHand','hand'); bindTouch('tBoost','boost');
$('tAction').addEventListener('click',handleAction);
$('tShoot').addEventListener('click',()=>{if(!game.player.inVehicle)shoot();});
$('tMenu').addEventListener('click',()=>{
  $('gmTitle').textContent='القائمة';
  $('gmContent').innerHTML=`<div class="section">
    <button onclick="openShop()">🛒 المتجر</button>
    <button onclick="openHouse()">🏠 البيت</button>
    <button onclick="openGarage()">🚗 الكراج</button>
    <button onclick="exitGame()">🚪 خروج</button>
  </div>`;
  $('gameMenu').style.display='block';
});
window.openShop=openShop; window.openHouse=openHouse; window.openGarage=openGarage;
$('gmClose').onclick=()=>{ $('gameMenu').style.display='none'; };

/* ===== معاينة ===== */
const pvCanvas=$('preview');
let pvRenderer=null,pvScene=null,pvCamera=null,pvCar=null,pvAngle=0;
function initPreview(){
  pvRenderer=new THREE.WebGLRenderer({canvas:pvCanvas,antialias:true,alpha:true});
  pvRenderer.setPixelRatio(Math.min(devicePixelRatio,2));
  pvRenderer.toneMapping=THREE.ACESFilmicToneMapping;
  pvRenderer.toneMappingExposure=1.1;
  pvRenderer.outputColorSpace=THREE.SRGBColorSpace;
  pvScene=new THREE.Scene();
  pvCamera=new THREE.PerspectiveCamera(38,1,0.1,100);
  pvCamera.position.set(6.8,3.9,7.6);
  pvCamera.lookAt(0,0.85,0);
  const pvPm=new THREE.PMREMGenerator(pvRenderer);
  pvScene.environment=pvPm.fromScene(new RoomEnvironment(),0.05).texture;
  pvScene.add(new THREE.HemisphereLight(0xbfd8ff,0x2a2030,1.5));
  const key=new THREE.DirectionalLight(0xffffff,2.4); key.position.set(5,10,6); pvScene.add(key);
  const rim=new THREE.DirectionalLight(0x66ccff,2.6); rim.position.set(-6,4,-7); pvScene.add(rim);
  const plat=new THREE.Mesh(new THREE.CylinderGeometry(3.1,3.35,0.28,48),
    new THREE.MeshStandardMaterial({color:0x0d1526,metalness:0.85,roughness:0.22}));
  plat.position.y=-0.16; pvScene.add(plat);
  resizePreview(); refreshPreviewCar();
}
function refreshPreviewCar(){
  if(!pvScene) return;
  if(pvCar){ pvScene.remove(pvCar); pvCar.traverse(o=>{if(o.geometry)o.geometry.dispose();}); }
  pvCar=buildCarMesh(selectedCar,selectedSkin).group;
  pvScene.add(pvCar);
}
function resizePreview(){
  if(!pvRenderer) return;
  const w=pvCanvas.clientWidth||300, h=pvCanvas.clientHeight||170;
  pvRenderer.setSize(w,h,false);
  pvCamera.aspect=w/h; pvCamera.updateProjectionMatrix();
}
let pvLast=performance.now();
function previewLoop(t){
  requestAnimationFrame(previewLoop);
  if(!pvRenderer||game.state!=='menu') return;
  const dt=Math.min(0.05,(t-pvLast)/1000); pvLast=t;
  pvAngle+=dt*0.55;
  if(pvCar) pvCar.rotation.y=pvAngle;
  pvRenderer.render(pvScene,pvCamera);
}

/* ===== القائمة ===== */
let selectedCar=0, selectedSkin=0, selectedMap=0;
function buildMenuUI(){
  const mapsEl=$('maps'); mapsEl.innerHTML='';
  MAPS.forEach((m,i)=>{
    const b=document.createElement('button');
    b.className='card';
    b.innerHTML=`<div class="dot" style="background:#${m.sky[1].toString(16).padStart(6,'0')}"></div>
      <b>${m.name}</b><span>${m.groundType}</span>`;
    b.onclick=()=>{selectedMap=i;refreshSel();loadMap(i);};
    mapsEl.appendChild(b);
  });
  const carsEl=$('cars'); carsEl.innerHTML='';
  CARS.forEach((c,i)=>{
    const b=document.createElement('button');
    b.className='card';
    b.innerHTML=`<div class="dot" style="background:#${c.hex.toString(16).padStart(6,'0')}"></div>
      <b>${c.name}</b><span>${c.price===0?'مجاني':'$'+c.price}</span>`;
    b.onclick=()=>{selectedCar=i;refreshSel();refreshPreviewCar();};
    carsEl.appendChild(b);
  });
  const skEl=$('skins'); skEl.innerHTML='';
  SKINS.forEach((s,i)=>{
    const d=document.createElement('button');
    d.className='skin';
    d.style.background=`linear-gradient(135deg,${s.c1} 0%,${s.c1} 42%,${s.c2} 42%,${s.c2} 100%)`;
    d.innerHTML=`<i>${s.n}</i>`;
    d.onclick=()=>{selectedSkin=i;refreshSel();refreshPreviewCar();};
    skEl.appendChild(d);
  });
  refreshSel();
}
function refreshSel(){
  [...$('maps').children].forEach((el,i)=>el.classList.toggle('sel',i===selectedMap));
  [...$('cars').children].forEach((el,i)=>el.classList.toggle('sel',i===selectedCar));
  [...$('skins').children].forEach((el,i)=>el.classList.toggle('sel',i===selectedSkin));
}

/* ===== بدء ===== */
function startGame(){
  const p=game.player;
  p.carIdx=selectedCar;
  p.skinIdx=selectedSkin;
  p.ownedCars=[selectedCar];
  p.ownedSkins=[selectedSkin];
  p.ownedWeapons=[];
  p.currentWeapon=null;
  p.ammo={};
  p.ownedConsumables={};
  p.ownedProperties=[];
  p.cash=500;
  p.health=100;
  p.score=0;
  p.inVehicle=false;
  p.pos.set(0,0,30);
  p.angle=Math.PI;
  p.vx=0; p.vz=0; p.vy=0;
  p.shootCooldown=0;
  p.activeMission=null;

  loadMap(selectedMap);

  // إعادة وضع اللاعب مشياً
  playerChar.group.position.copy(p.pos);
  playerChar.group.visible=true;
  playerChar.gunGroup.visible=false;

  game.state='playing';
  $('menu').classList.add('hidden');
  $('hud').classList.remove('hidden');
  if('ontouchstart' in window) $('touch').classList.remove('hidden');

  camera.position.set(0,5,50);
  camera.fov=64; camera.updateProjectionMatrix();

  updateHUD();
  showHint('مرحباً! اضغط E للتفاعل، R للركوب، F للنزول');
}

function exitGame(){
  game.state='menu';
  $('menu').classList.remove('hidden');
  $('hud').classList.add('hidden');
  $('touch').classList.add('hidden');
  $('gameMenu').style.display='none';
  playerChar.group.visible=false;
}

/* ===== أزرار ===== */
$('btnSolo').onclick=()=>{startGame();};
$('btnHost').onclick=()=>{startGame();}; // نفس الشيء حالياً
$('btnJoin').onclick=()=>{startGame();};
$('btnExit').onclick=exitGame;

/* ===== تحجيم ===== */
function onResize(){
  const w=innerWidth,h=innerHeight;
  renderer.setSize(w,h);
  composer.setSize(w,h);
  bloom.setSize(w,h);
  camera.aspect=w/h; camera.updateProjectionMatrix();
  resizePreview();
}
addEventListener('resize',onResize);

/* ===== إقلاع ===== */
loadMap(0);
buildMenuUI();
initPreview();
requestAnimationFrame(previewLoop);
onResize();
</script>
</body>
</html>
